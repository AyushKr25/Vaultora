# Netlify configuration for the SecureBank frontend
# Deploy from this repo root; Netlify builds the Vite app from frontend/

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# SPA fallback: serve index.html for all routes (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: proxy /api to a backend. If you deploy the backend on Render and
# set VITE_API_URL instead (recommended), this section is not used.
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend.onrender.com/api/:splat"
#   status = 200
#   force = true
