# Netlify configuration for the SecureBank frontend
# Deploy from this repo root; Netlify builds the Vite app from frontend/

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# Proxy API calls to the Flask backend on Render.
# This runs at the edge - no VITE_API_URL env var needed, and no CORS issues.
# Must be listed BEFORE the SPA catch-all below (first match wins).
[[redirects]]
  from = "/api/*"
  to = "https://vaultora-xeic.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback: serve index.html for all other routes (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
